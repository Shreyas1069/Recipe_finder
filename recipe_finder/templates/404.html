{% extends "base.html" %}

{% block title %}Page Not Found - Recipe Finder{% endblock %}

{% block content %}
<section class="error-page">
    <div class="container">
        <div class="error-content">
            <span class="error-code">404</span>
            <h1>Page Not Found</h1>
            <p>{{ error_message or "The page you are looking for does not exist." }}</p>
            <div class="error-actions">
                <a href="{{ url_for('home') }}" class="btn btn-primary">Go Home</a>
                <a href="{{ url_for('find_recipes') }}" class="btn btn-outline">Find Recipes</a>
            </div>
        </div>
    </div>
</section>
{% endblock %}
